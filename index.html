<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harshdeep Singh - Linktree</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      color: #1c1c1c;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }
    .profile-pic {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #004080;
    }
    h1 {
      margin-top: 20px;
      font-size: 28px;
      color: #003366;
    }
    p {
      font-size: 16px;
      color: #555;
      margin-bottom: 30px;
    }
    .link {
      display: block;
      width: 90%;
      max-width: 400px;
      margin: 10px 0;
      padding: 15px;
      background-color: #003366;
      color: white;
      text-align: center;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }
    .link:hover {
      background-color: #0055aa;
    }
  </style>
</head>
<body>
  <img class="profile-pic" src="pROFILE.jpg" alt="Harshdeep Singh Profile" />
  <h1>Harshdeep Singh</h1>
  <p>Business Enthusiast - Majhe Aale</p>

  <a class="link" href="https://github.com/HARSHDEEPSINGHBEDI" target="_blank">GitHub</a>
  <a class="link" href="https://www.linkedin.com/in/harshdeep-singh-bedi" target="_blank">LinkedIn</a>
  <a class="link" href="#">Download CV</a>
</body>
</html>
